# Деплой DuoStream: каждый пуш в master собирает установщик и portable-версию и публикует их
# в GitHub Releases с тегом v<major>.<minor>.<номер запуска> (major.minor — из client/package.json).
# Установленные копии приложения сами находят новую версию и ставят её при выходе (client/src/main/updater.ts).
# Запустить вручную: Actions → Release → Run workflow.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # создание релиза и загрузка файлов токеном GITHUB_TOKEN

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Собственный захват экрана (client/native/capture) — C#, .NET 10
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Тесты сигнального сервера
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Зависимости клиента
        working-directory: client
        run: npm ci

      - name: Проверка типов TypeScript
        working-directory: client
        run: npm run typecheck

      - name: Проверка шумодава (DeepFilterNet3 и DTLN)
        working-directory: client
        run: |
          node scripts/test-denoiser.mts --model=dfn3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test-denoiser.mts --model=dtln

      - name: Сборка
        working-directory: client
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $major, $minor = $pkg.version.Split('.')[0..1]
          $version = "$major.$minor.${{ github.run_number }}"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Host "Версия $version"
          "VERSION=$version" >> $env:GITHUB_ENV
          ./scripts/dist.ps1

      # Описание релиза — верхний раздел CHANGELOG.md без записей, которые уже были в описании прошлого
      # релиза (.github/scripts/release-notes.mts), и ссылка на все коммиты с прошлого релиза. Раздел
      # «Следующая версия» могли не переименовать после прошлого релиза — старое всё равно не повторяется
      - name: Описание релиза из CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --quiet
          $prev = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          $prevNotes = "$env:RUNNER_TEMP/previous.md"
          if ($prev) { gh release view $prev --repo "${{ github.repository }}" --json body -q .body > $prevNotes }
          if (-not $prev -or $LASTEXITCODE) { $prevNotes = '-' }
          node .github/scripts/release-notes.mts CHANGELOG.md $prevNotes "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($prev) { Add-Content -Path "$env:RUNNER_TEMP/notes.md" -Value "`n**Все изменения:** https://github.com/${{ github.repository }}/compare/$prev...v$env:VERSION" -Encoding utf8 }
          Get-Content "$env:RUNNER_TEMP/notes.md" -Encoding utf8

      # Один вызов gh: создаёт релиз черновиком, загружает файлы и публикует — тег v<версия> ставится
      # на собранный коммит. latest.yml нужен автообновлению (client/src/main/updater.ts).
      - name: Публикация релиза
        working-directory: client/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          gh release create "v$v" `
            "DuoStream-Setup-$v.exe" "DuoStream-Setup-$v.exe.blockmap" "latest.yml" "DuoStream-$v-portable.exe" `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "DuoStream $v" --notes-file "$env:RUNNER_TEMP/notes.md"
          exit $LASTEXITCODE
