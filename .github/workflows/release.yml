# Деплой DuoStream: каждый пуш в master собирает установщик и portable-версию и публикует их
# в GitHub Releases с тегом v<major>.<minor>.<номер запуска> (major.minor — из client/package.json).
# Установленные копии приложения сами находят новую версию и ставят её при выходе (client/src/main/updater.ts).
# Запустить вручную: Actions → Release → Run workflow.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # создание релиза и загрузка файлов токеном GITHUB_TOKEN

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Собственный захват экрана (client/native/capture) — C#, .NET 10
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Тесты сигнального сервера
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Зависимости клиента
        working-directory: client
        run: npm ci

      - name: Проверка типов TypeScript
        working-directory: client
        run: npm run typecheck

      - name: Проверка шумодава (DeepFilterNet3 и DTLN)
        working-directory: client
        run: |
          node scripts/test-denoiser.mts --model=dfn3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test-denoiser.mts --model=dtln

      - name: Сборка
        working-directory: client
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $major, $minor = $pkg.version.Split('.')[0..1]
          $version = "$major.$minor.${{ github.run_number }}"
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Host "Версия $version"
          "VERSION=$version" >> $env:GITHUB_ENV
          ./scripts/dist.ps1

      # Описание релиза — верхний раздел CHANGELOG.md (от первого «## » до следующего) и ссылка
      # на все коммиты с прошлого релиза
      - name: Описание релиза из CHANGELOG.md
        run: |
          git fetch --tags --quiet
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          if (-not $start) { throw 'В CHANGELOG.md нет ни одного раздела «## …»' }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          $notes = ($body -join "`n").Trim()
          $prev = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          if ($prev) { $notes += "`n`n**Все изменения:** https://github.com/${{ github.repository }}/compare/$prev...v$env:VERSION" }
          Set-Content -Path "$env:RUNNER_TEMP/notes.md" -Value $notes -Encoding utf8
          Write-Host $notes

      # Один вызов gh: создаёт релиз черновиком, загружает файлы и публикует — тег v<версия> ставится
      # на собранный коммит. latest.yml нужен автообновлению (client/src/main/updater.ts).
      - name: Публикация релиза
        working-directory: client/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          gh release create "v$v" `
            "DuoStream-Setup-$v.exe" "DuoStream-Setup-$v.exe.blockmap" "latest.yml" "DuoStream-$v-portable.exe" `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "DuoStream $v" --notes-file "$env:RUNNER_TEMP/notes.md"
          exit $LASTEXITCODE
